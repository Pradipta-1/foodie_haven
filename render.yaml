services:
  # -----------------------------------------
  # 1. Backend API (Render Web Service)
  # -----------------------------------------
  - type: web
    name: foodie-haven-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 32-byte secret
      - key: CLIENT_URL
        sync: false # Set to your frontend Render URL e.g. https://foodie-haven-frontend.onrender.com

  # -----------------------------------------
  # 2. Frontend SPA (Render Static Site)
  # -----------------------------------------
  - type: web
    name: foodie-haven-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: foodie-haven-backend
          envVarKey: RENDER_EXTERNAL_URL
          # Automatically attaches the backend's live URL
